appId: com.atlasasistan.app
productName: Atlas
copyright: Copyright © 2026 Kadir
beforePack: scripts/before-pack.cjs
directories:
  output: release
  buildResources: build
# Arayüz kütüphaneleri derlemede out/ içine gömülür; pakete yalnızca ana sürecin ihtiyaç duydukları girer.
files:
  - out/**
  - resources/icon.png
  - package.json
  - "!**/*.map"
  - "!**/*.d.{ts,mts,cts}"
# Lisans metinleri kurulum klasöründe (resources/) düz dosya olarak durur; bildirim dosyasını "npm run notices" üretir.
extraResources:
  - from: LICENSE
    to: LICENSE.txt
  - from: resources/third-party-notices.txt
    to: third-party-notices.txt
# Kurulu Atlas.exe sıradan bir Node.js çalıştırıcısı gibi kullanılamasın (ELECTRON_RUN_AS_NODE, NODE_OPTIONS, --inspect)
# ve uygulama kodu yalnızca bütünlüğü denetlenen app.asar'dan yüklensin. Alt süreçler utilityProcess ile açıldığı için
# runAsNode kapalıyken de çalışır.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
electronLanguages:
  - tr
  - en-US
win:
  icon: build/icon.ico
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Atlas-Setup-${version}.${ext}
publish: null
